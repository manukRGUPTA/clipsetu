<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153a35">
  <title>Clipsetu — clipping campaigns, made accountable</title>
  <style>
    :root{--ink:#142321;--muted:#687673;--line:#e4eae6;--canvas:#f5f7f5;--paper:#fff;--forest:#153a35;--forest-2:#214f47;--lime:#d7f36a;--lime-dark:#adc943;--teal:#dcefe9;--amber:#f2b85b;--amber-bg:#fff5df;--red:#bd554b;--red-bg:#fff0ee;--green:#237354;--green-bg:#e7f5ed;--blue:#5579a5;--shadow:0 18px 55px rgba(14,35,30,.12);--radius:16px;--sidebar:250px}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;background:var(--forest);color:#eef7f3;padding:22px 15px 18px;display:flex;flex-direction:column;z-index:10}
    .brand{display:flex;align-items:center;gap:11px;padding:2px 11px 23px}
    .brand-mark{width:35px;height:35px;display:grid;place-items:center;background:var(--lime);border-radius:11px;color:var(--forest);font-weight:900;font-size:18px;letter-spacing:-2px}
    .brand-name{font-weight:760;font-size:18px;letter-spacing:-.45px}
    .brand-sub{font-size:10px;color:#a9c4bc;margin-top:3px;letter-spacing:.1em;text-transform:uppercase}
    .workspace-tag{margin:0 8px 22px;border:1px solid rgba(224,242,233,.13);border-radius:11px;padding:11px 12px;background:rgba(255,255,255,.045)}
    .workspace-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:#a6c7bc}
    .workspace-name{font-size:12px;font-weight:650;margin-top:5px}
    .nav-label{padding:0 13px 7px;font-size:10px;letter-spacing:.13em;color:#91b1a6;text-transform:uppercase}
    .nav{display:grid;gap:4px}
    .nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#c4d9d2;text-align:left;padding:10px 13px;border-radius:10px;font-size:13px;font-weight:550;transition:background .15s,color .15s}
    .nav button:hover{background:rgba(255,255,255,.08);color:white}
    .nav button.active{background:#2c574d;color:white}
    .nav button.active .nav-icon{color:var(--lime)}
    .nav-icon{width:17px;height:17px;display:grid;place-items:center;color:#9ebdb2}
    .nav-icon svg{width:17px;height:17px;stroke:currentColor}
    .sidebar-bottom{margin-top:auto;padding:13px 8px 0}
    .demo-note{font-size:10.5px;line-height:1.5;color:#aac4bb;border-top:1px solid rgba(255,255,255,.12);padding:14px 5px 0}
    .demo-note strong{color:#e8f5ef}
    .main{min-width:0}
    .topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.84);position:sticky;top:0;z-index:8;backdrop-filter:blur(12px)}
    .crumb{font-size:12px;color:var(--muted)}
    .crumb strong{color:var(--ink);font-weight:650}
    .top-actions{display:flex;align-items:center;gap:10px}
    .demo-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #e8d9a5;background:#fff9e9;border-radius:999px;padding:6px 9px;color:#775e19;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .demo-dot{width:6px;height:6px;background:#d9a334;border-radius:50%}
    .role-select{height:36px;border:1px solid var(--line);background:white;border-radius:9px;padding:0 28px 0 10px;color:#344440;font-size:12px;font-weight:600}
    .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e1eee8;color:var(--forest);font-size:12px;font-weight:750;border:1px solid #d1e2d8}
    .mobile-brand{display:none}
    .content{max-width:1440px;margin:0 auto;padding:31px 34px 60px}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:23px}
    .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6f857b;font-weight:700;margin-bottom:7px}
    h1{font-size:28px;line-height:1.14;letter-spacing:-.8px;margin:0;font-weight:730}
    .subtitle{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.55;max-width:700px}
    .head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1px solid transparent;padding:10px 14px;font-size:12px;font-weight:680;transition:transform .12s,background .12s,border-color .12s}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--forest);color:white}
    .btn-primary:hover{background:#205247}
    .btn-lime{background:var(--lime);color:#18302a}
    .btn-lime:hover{background:#cce85b}
    .btn-secondary{background:white;color:#2c3b37;border-color:#dfe6e1}
    .btn-secondary:hover{background:#f8faf8;border-color:#c7d4cc}
    .btn-quiet{background:transparent;color:#4c6059;border-color:transparent;padding:8px 10px}
    .btn-quiet:hover{background:#eef3ef}
    .btn-danger{background:var(--red-bg);color:#a1433a;border-color:#f0d3cf}
    .btn-small{padding:7px 10px;font-size:11px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .notice{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;background:#eef5e1;border:1px solid #dce9bf;border-radius:12px;color:#445434;font-size:11.5px;line-height:1.55;margin:0 0 19px}
    .notice strong{color:#30421f}
    .notice-icon{font-size:16px;line-height:1}
    .notice-warn{background:var(--amber-bg);border-color:#f2dfb5;color:#6d5624}
    .notice-danger{background:var(--red-bg);border-color:#eed4cf;color:#884a42}
    .grid{display:grid;gap:14px}
    .stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 18px;min-width:0}
    .stat-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .stat-label{font-size:11px;color:var(--muted);font-weight:570}
    .stat-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#eff5eb;color:#4e6d4b;font-size:15px}
    .stat-value{font-size:25px;font-weight:760;letter-spacing:-.7px;margin-top:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stat-foot{font-size:10.5px;color:#7f8d87;margin-top:5px}
    .stat-foot .positive{color:var(--green);font-weight:650}
    .split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,.9fr);gap:15px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;min-width:0}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid #edf1ed}
    .panel-title{font-size:13px;font-weight:700;letter-spacing:-.1px}
    .panel-sub{font-size:10.5px;color:var(--muted);margin-top:4px}
    .panel-body{padding:17px 18px}
    .text-link{border:0;background:transparent;color:#286457;font-size:11px;font-weight:700;padding:4px}
    .text-link:hover{text-decoration:underline}
    .campaign-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1ed}
    .campaign-row:last-child{border-bottom:0;padding-bottom:0}
    .campaign-row:first-child{padding-top:0}
    .campaign-main{display:flex;align-items:center;gap:11px;min-width:0}
    .cover{width:41px;height:41px;flex:0 0 41px;border-radius:11px;background:#e3eee5;color:#2e5c47;display:grid;place-items:center;font-weight:750;font-size:12px;letter-spacing:-.3px}
    .cover.orange{background:#faead7;color:#996021}
    .cover.blue{background:#e3edf6;color:#456788}
    .cover.purple{background:#ede8f3;color:#665381}
    .campaign-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .campaign-meta{font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-end{display:flex;align-items:center;gap:12px}
    .row-number{text-align:right;font-size:11px;font-weight:680;white-space:nowrap}
    .row-number small{display:block;font-size:9.5px;color:var(--muted);font-weight:500;margin-top:3px}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:9.5px;line-height:1;font-weight:700;white-space:nowrap}
    .badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-live,.badge-approved,.badge-paid,.badge-active{background:var(--green-bg);color:#286d50}
    .badge-draft,.badge-pending,.badge-review{background:var(--amber-bg);color:#866316}
    .badge-rejected,.badge-suspended{background:var(--red-bg);color:#a0473f}
    .badge-revision,.badge-hold{background:#edf0f2;color:#5d6a71}
    .badge-neutral{background:#eef2ef;color:#64726c}
    .attention-list{display:grid;gap:11px}
    .attention-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #edf1ed}
    .attention-item:last-child{border-bottom:0;padding-bottom:0}
    .attention-mark{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#fff3db;color:#956712;font-weight:800}
    .attention-mark.green{background:#e4f3eb;color:#38765b}
    .attention-copy{font-size:11px;line-height:1.4;color:#34433e}
    .attention-copy small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .progress-wrap{margin-top:12px}
    .progress-label{display:flex;justify-content:space-between;color:#607069;font-size:10px;margin-bottom:7px}
    .progress{height:7px;background:#ebefeb;border-radius:99px;overflow:hidden}
    .progress>span{display:block;height:100%;border-radius:99px;background:#739960}
    .bar-chart{height:148px;display:flex;align-items:flex-end;gap:13px;padding:10px 8px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 36px,#f1f4f1 37px)}
    .bar-group{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative}
    .bar{width:min(21px,32%);border-radius:5px 5px 0 0;background:#8fb296;min-height:4px}
    .bar.self{background:#dce5dc}
    .bar-label{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:9px;color:#7c8983;white-space:nowrap}
    .chart-legend{display:flex;gap:14px;margin-top:14px;font-size:9.5px;color:#6e7b74}
    .legend-dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;background:#8fb296}
    .legend-dot.self{background:#dce5dc}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;text-align:left}
    th{padding:11px 14px;font-size:9.5px;color:#7b8982;font-weight:650;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;border-bottom:1px solid var(--line)}
    td{padding:12px 14px;border-bottom:1px solid #eff2ef;font-size:11px;vertical-align:middle}
    tr:last-child td{border-bottom:0}
    .person-cell{display:flex;align-items:center;gap:9px;min-width:150px}
    .mini-avatar{width:29px;height:29px;display:grid;place-items:center;flex:0 0 29px;border-radius:50%;background:#e6eee8;color:#38564a;font-size:9px;font-weight:750}
    .person-name{font-size:11px;font-weight:650}
    .person-sub{font-size:9.5px;color:var(--muted);margin-top:3px}
    .platform-tag{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#5a6963;background:#f1f4f1;border-radius:5px;padding:4px 6px;white-space:nowrap}
    .verified{color:#2a7352;font-weight:650}
    .self-reported{color:#8b6d2a}
    .table-actions{display:flex;gap:5px;justify-content:flex-end}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
    .searchbox{position:relative;min-width:210px;max-width:300px;flex:1}
    .searchbox input{width:100%;height:35px;padding:0 11px 0 34px;border:1px solid #e1e8e2;background:#fff;border-radius:8px;font-size:11px;outline:none}
    .searchbox input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#83a990;box-shadow:0 0 0 3px rgba(77,128,98,.12)}
    .search-icon{position:absolute;left:11px;top:10px;color:#809089;font-size:12px}
    .filters{display:flex;gap:5px;flex-wrap:wrap}
    .filter-btn{border:1px solid transparent;background:transparent;color:#6e7b74;border-radius:7px;padding:7px 9px;font-size:10px;font-weight:620}
    .filter-btn.active{background:#eaf1eb;color:#295545}
    .empty{padding:34px 18px;text-align:center}
    .empty-mark{width:45px;height:45px;border-radius:14px;margin:0 auto 11px;background:#eef3ee;color:#567563;display:grid;place-items:center;font-size:19px}
    .empty-title{font-size:12px;font-weight:700}
    .empty-copy{max-width:360px;margin:6px auto 13px;color:var(--muted);font-size:10.5px;line-height:1.5}
    .campaign-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .campaign-card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,transform .15s}
    .campaign-card:hover{border-color:#bfd0c3;transform:translateY(-1px)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .card-owner{font-size:10px;color:var(--muted);margin-top:8px}
    .card-title{font-size:14px;font-weight:730;letter-spacing:-.2px;margin-top:13px;line-height:1.3}
    .card-description{font-size:10.5px;line-height:1.5;color:#64736c;margin-top:7px;min-height:32px}
    .card-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px 0;margin-top:8px;border-top:1px solid #edf1ed;border-bottom:1px solid #edf1ed}
    .card-stat-label{font-size:9px;color:#7f8b85}
    .card-stat-value{font-size:11.5px;font-weight:680;margin-top:4px}
    .tag-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px}
    .soft-tag{background:#f2f5f1;border-radius:5px;padding:5px 7px;color:#68776f;font-size:9px;font-weight:600}
    .card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:13px}
    .page-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .inline-select{height:35px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 25px 0 10px;color:#45564e;font-size:11px}
    .content-list{display:grid;gap:9px}
    .asset-row{background:white;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;align-items:center;gap:12px}
    .asset-icon{width:36px;height:36px;background:#eef3ee;border-radius:10px;display:grid;place-items:center;color:#456b54;font-size:14px;flex:0 0 36px}
    .asset-info{flex:1;min-width:0}
    .asset-title{font-size:11.5px;font-weight:670;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .asset-url{font-size:9.5px;color:#64776f;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
    .asset-meta{font-size:9px;color:#89948f;margin-top:4px}
    .asset-actions{display:flex;align-items:center;gap:4px}
    .two-col{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.75fr);gap:15px}
    .rule-box{border:1px solid #e7ece6;background:#f9fbf8;border-radius:10px;padding:12px 13px;margin-top:10px}
    .receipt-preview{display:block;max-width:100%;max-height:52vh;object-fit:contain;margin:14px auto;border:1px solid var(--line);border-radius:10px;background:#f7f9f6}
    .rule-title{font-size:10px;color:#5c6b63;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
    .rule-value{font-size:12px;font-weight:680;margin-top:5px;line-height:1.45}
    .rule-note{font-size:9.5px;color:#79867f;margin-top:4px;line-height:1.45}
    .role-intro{padding:20px;background:var(--forest);border-radius:15px;color:white;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}
    .role-intro h2{font-size:18px;margin:0;letter-spacing:-.4px}
    .role-intro p{font-size:11px;line-height:1.5;color:#c5d9d1;margin:6px 0 0;max-width:510px}
    .role-intro .btn{flex:0 0 auto}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
    .step-card{padding:14px;border:1px solid var(--line);border-radius:12px;background:white}
    .step-index{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:#e8f2e4;color:#467048;font-size:10px;font-weight:800}
    .step-title{font-size:11px;font-weight:700;margin-top:10px}
    .step-copy{font-size:10px;line-height:1.45;color:#6d7b74;margin-top:5px}
    .notice-stack{display:grid;gap:8px}
    .subtle{font-size:10px;color:var(--muted);line-height:1.5}
    .amount{font-variant-numeric:tabular-nums}
    .mono{font-variant-numeric:tabular-nums}
    .modal-backdrop{position:fixed;inset:0;background:rgba(14,31,27,.44);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
    .modal{width:min(650px,100%);max-height:min(92vh,850px);overflow:auto;background:white;border-radius:16px;box-shadow:var(--shadow);animation:modal-in .18s ease-out}
    @keyframes modal-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
    .modal-title{font-size:16px;font-weight:750;letter-spacing:-.3px}
    .modal-subtitle{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.45}
    .close-btn{border:0;background:#f2f5f2;color:#52625a;border-radius:8px;width:30px;height:30px;font-size:18px;line-height:1}
    .modal-body{padding:18px 20px}
    .modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .field.full{grid-column:1/-1}
    .field label{font-size:10px;font-weight:670;color:#42534b}
    .field label .required{color:#b4604f}
    .field input,.field select,.field textarea{border:1px solid #dfe6e0;border-radius:8px;background:white;color:#24332e;padding:9px 10px;font-size:11px;outline:none;width:100%}
    .field input,.field select{height:37px}
    .field textarea{resize:vertical;min-height:74px;line-height:1.5}
    .field-help{font-size:9.3px;color:#7a8781;line-height:1.4}
    .field-check{display:flex;align-items:flex-start;gap:8px;font-size:10px;color:#586760;line-height:1.45}
    .field-check input{margin:1px 0 0;accent-color:#456f4c}
    .divider-label{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:9.5px;color:#79877f;text-transform:uppercase;letter-spacing:.1em;font-weight:720}
    .divider-label:after{content:"";height:1px;background:#e8ede8;flex:1}
    .toast{position:fixed;right:20px;bottom:20px;background:#183d35;color:white;padding:12px 15px;border-radius:10px;z-index:90;box-shadow:var(--shadow);font-size:11px;max-width:min(380px,calc(100vw - 32px));animation:toast-in .2s ease-out}
    @keyframes toast-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .risk-flag{font-size:9px;font-weight:700;color:#9b6230;background:#fff2df;border-radius:5px;padding:4px 6px}
    .toggle-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eef1ee}
    .toggle-copy{font-size:10.5px;font-weight:650}
    .toggle-copy small{display:block;font-size:9.5px;color:var(--muted);font-weight:450;margin-top:4px}
    .user-role{font-size:9px;font-weight:720;text-transform:uppercase;letter-spacing:.04em;background:#eff3ef;padding:5px 7px;border-radius:5px;color:#5f6e65}
    .audit-list{display:grid}
    .audit-row{display:grid;grid-template-columns:58px 1fr;gap:11px;padding:11px 0;border-bottom:1px solid #edf1ed}
    .audit-time{font-size:9px;color:#839087}
    .audit-copy{font-size:10.5px;color:#46564e;line-height:1.45}
    .mobile-nav{display:none}

    function unitLabel(unit){return {per_clip:"per approved clip",per_click:"per verified click",per_1k_views:"per 1,000 verified views"}[unit]||"unit not confirmed";}

    function campaignTerms(c){

    function basePay(s,c){
      if(!c||s.status!=="approved"||s.risk||!c.rateUnit)return 0;

      if(b2&&v>=t2)return b2;if(b1&&v>=t1)return b1;return 0;

    function aggregateBonusPool(c){
      if(!c||c.bonusScope!=="campaign"||!c.bonusStacking)return 0;
      var v=app.data.submissions.filter(function(s){return s.campaignId===c.id&&s.status==="approved"&&!s.risk;}).reduce(function(t,s){return t+(Number(s.verifiedViews)||0);},0),b1=Number(c.bonus1)||0,b2=Number(c.bonus2)||0,t1=Number(c.threshold1)||0,t2=Number(c.threshold2)||0;
      if(c.bonusStacking==="cumulative")return (b1&&v>=t1?b1:0)+(b2&&v>=t2?b2:0);
      if(b2&&v>=t2)return b2;if(b1&&v>=t1)return b1;return 0;

    function aggregateBonusFor(s,c){
      if(!c||c.bonusScope!=="campaign"||!c.bonusAllocation)return 0;
      var pool=aggregateBonusPool(c);if(!pool)return 0;
      var approved=app.data.submissions.filter(function(x){return x.campaignId===c.id&&x.status==="approved"&&!x.risk;});
      if(!approved.length)return 0;
      var byClipper={};approved.forEach(function(x){byClipper[x.clipperId]=(byClipper[x.clipperId]||0)+(Number(x.verifiedViews)||0);});
      var ids=Object.keys(byClipper),ownerViews=byClipper[s.clipperId]||0,myViews=Number(s.verifiedViews)||0,total=ids.reduce(function(t,id){return t+byClipper[id];},0),share=0;
      if(c.bonusAllocation==="equal")share=pool/ids.length;
      else if(c.bonusAllocation==="proportional")share=total?pool*ownerViews/total:0;
      else if(c.bonusAllocation==="top"){var top=ids.slice().sort(function(a,b){return byClipper[b]-byClipper[a];})[0];share=top===s.clipperId?pool:0;}
      if(!share)return 0;

      return ownerViews?share*myViews/ownerViews:share/Math.max(clipCount,1);
    }

        var c=campaign(s.campaignId),base=basePay(s,c),allocation=app.data.bonusAllocations.find(function(a){return a.submissionId===s.id;}),bonus=perClipBonus(s,c)+aggregateBonusFor(s,c)+(allocation?Number(allocation.amount)||0:0),pool=c?aggregateBonusPool(c):0,allocated=c?app.data.bonusAllocations.filter(function(a){return a.campaignId===c.id;}).reduce(function(t,a){return t+(Number(a.amount)||0);},0):0,needsAllocation=!!(c&&c.bonusScope==="campaign"&&pool>allocated&&c.bonusAllocation==="manual");

        var paymentRecords=app.data.payouts.filter(function(p){return p.submissionId===s.id;}),paid=paymentRecords.reduce(function(t,p){return t+(Number(p.amount)||0);},0);

      if(!v.url&&!f){notify("Add a source URL or choose a local file reference.");return;}
      var row={id:"a-"+Date.now(),title:v.title.trim(),platform:v.platform,url:v.url.trim(),ownerId:app.role==="business"?app.userId:currentUser().id,fileName:f?f.name:"",notes:v.notes||"",createdAt:today(),isDemo:false};
      app.data.assets.unshift(row);addAudit("Content source “"+row.title+"” added to the library.");save();app.modal="";app.view="content";render();notify("Content reference added. A selected file was not uploaded.");
    }
    function handleRegister(form,event){
      event.preventDefault();var v=formValues(form),id="u-"+Date.now(),u={id:id,name:v.name.trim(),email:v.email.trim(),role:v.role,businessType:v.businessType,handle:v.handle.trim(),status:v.role==="clipper"?"pending":"active",createdAt:today()};
      app.data.users.unshift(u);app.userId=id;app.role=v.role==="clipper"?"clipper":"business";app.view="overview";addAudit(u.name+" registered as "+u.role+" in demo mode.");save();app.modal="";render();notify("Demo account created. No login credentials were created.");
    }
    function handleSubmissionSubmit(form,event){
      event.preventDefault();var v=formValues(form),u=currentUser(),c=campaign(v.campaignId);if(!c||c.status!=="live"){notify("Choose a live campaign.");return;}
      var post=safeHref(v.clipUrl),src=safeHref(v.sourceUrl);if(!post||!src){notify("Enter valid http(s) links for both your published clip and source.");return;}
      var s={id:"s-"+Date.now(),campaignId:v.campaignId,clipperId:u.id,clipperName:u.name,handle:u.handle||"Clipper",platform:v.platform,clipUrl:post,sourceUrl:src,claimedViews:Number(v.claimedViews)||0,claimedClicks:Number(v.claimedClicks)||0,verifiedViews:0,verifiedClicks:0,status:"pending",submittedAt:today(),reviewNote:"",risk:false,fileName:(form.querySelector('[name="proofFile"]').files[0]||{}).name||"",isDemo:false};
      app.data.submissions.unshift(s);addAudit(u.name+" submitted a clip for “"+c.name+"”.");save();app.modal="";app.view="submissions";app.filter="all";render();notify("Clip submitted for human review.");
    }
    function handleReviewSubmit(form,event){
      event.preventDefault();var v=formValues(form),s=app.data.submissions.find(function(x){return x.id===app.editingId;});if(!s)return;
      s.verifiedViews=Math.max(0,Number(v.verifiedViews)||0);s.verifiedClicks=Math.max(0,Number(v.verifiedClicks)||0);s.status=v.reviewStatus||"pending";s.reviewNote=(v.reviewNote||"").trim();s.reviewedAt=today();
      addAudit("Submission from "+s.clipperName+" marked "+s.status+"; verified "+number(s.verifiedViews)+" views and "+number(s.verifiedClicks)+" clicks.");
      save();app.modal="";app.editingId="";render();notify(s.status==="approved"?"Clip approved; earnings follow the published terms.":"Review decision saved.");
    }
    function handlePayoutMethodSubmit(form,event){
      event.preventDefault();if(app.role!=="clipper"){notify("Only a clipper can submit their demo payout method.");return;}
      var v=formValues(form),type=v.methodType,label="";
      if(type==="upi"){label=maskedUpi(v.upiId);if(!label){notify("Enter a fake demo UPI alias such as clipper.demo@upi.");return;}}
      else if(type==="bank"){var suffix=String(v.bankLast4||"").replace(/\D/g,"");if(!/^\d{4}$/.test(suffix)){notify("Enter exactly four fake demo digits, not a full account number.");return;}label=(v.bankName==="demo-bank"?"Demo Bank":"Sample Bank")+" · •••• "+suffix;}
      else{notify("Choose UPI or bank account.");return;}
      var method={id:"pm-"+Date.now(),clipperId:app.userId,type:type,label:label,status:"pending",submittedAt:today(),reviewNote:"Awaiting admin review."};
      app.data.payoutMethods=(app.data.payoutMethods||[]).filter(function(m){return m.clipperId!==app.userId;});app.data.payoutMethods.unshift(method);
      addAudit(currentUser().name+" submitted a masked demo payout method for admin review.");save();app.modal="";app.view="payouts";render();notify("Masked demo method submitted; admin review is pending.");
    }
    function handlePayoutMethodDecision(id,status){
      if(app.role!=="admin"){notify("Only the admin demo role can review payout methods.");return;}
      var method=(app.data.payoutMethods||[]).find(function(m){return m.id===id;});if(!method||method.status!=="pending"||(status!=="approved"&&status!=="rejected"))return;
      method.status=status;method.reviewNote=status==="approved"?"Approved in demo review; only a masked label is stored.":"Rejected in demo review; submit a corrected demo method.";method.reviewedAt=today();
      addAudit("Masked payout method for "+(user(method.clipperId)||{}).name+" marked "+status+".");save();render();notify("Demo payout method "+status+"; no payment was sent.");
    }
    function handlePayoutSubmit(form,event){
      event.preventDefault();if(app.role!=="admin"){notify("Only an admin can record a manual payment in this demo.");return;}
      var v=formValues(form),s=app.data.submissions.find(function(x){return x.id===v.submissionId;}),row=payoutRows().find(function(r){return r.submission.id===v.submissionId;}),method=s&&payoutMethodFor(s.clipperId);
      if(!s||!row||row.locked){notify("This payout is not ready; check its published terms.");return;}
      if(!method||method.status!=="approved"){notify("Approve the clipper's payout method before recording payment.");return;}
      if(row.needsAllocation){notify("Allocate the campaign bonus pool before recording this clip's payout.");return;}
      var amount=Math.max(0,Number(v.paidAmount)||0);if(amount===0){notify("Enter the amount already paid outside this demo.");return;}if(amount>row.remaining+0.005){notify("The recorded amount cannot exceed the current unpaid balance of "+money(row.remaining)+".");return;}
      var fileInput=form.querySelector&&form.querySelector('[name="receiptFile"]'),file=fileInput&&fileInput.files&&fileInput.files[0];if(file&&(!/^image\/(png|jpeg|webp)$/.test(file.type||"")||Number(file.size)>2*1024*1024)){notify("Use a PNG, JPEG or WebP demo image up to 2 MB.");return;}
      var rawReference=String(v.reference||"").trim();if(!rawReference){notify("Enter a fake demo payment reference.");return;}
      var payoutId="p-"+Date.now(),maskedReference="••••"+rawReference.slice(-4);
      if(file&&typeof URL.createObjectURL==="function"){try{app.receiptPreviews[payoutId]=URL.createObjectURL(file);}catch(e){}}
      app.data.payouts.unshift({id:payoutId,submissionId:s.id,clipperId:s.clipperId,amount:amount,reference:maskedReference,receiptAttached:!!file,recordedAt:today()});
      addAudit("Manual ledger payment recorded for "+s.clipperName+"; demo reference masked, no transfer made.");save();app.modal="";render();notify("Manual payment record saved; no money moved.");
    }
    function handleBonusAllocationSubmit(form,event){
      event.preventDefault();var v=formValues(form),s=app.data.submissions.find(function(x){return x.id===v.submissionId;}),c=s&&campaign(s.campaignId),pool=c?aggregateBonusPool(c):0,amount=Math.max(0,Number(v.allocationAmount)||0);
      if(!s||!c||c.bonusAllocation!=="manual"||!pool){notify("There is no earned manual bonus pool to allocate yet.");return;}
      var already=app.data.bonusAllocations.filter(function(a){return a.campaignId===c.id&&a.submissionId!==s.id;}).reduce(function(t,a){return t+(Number(a.amount)||0);},0);
      if(amount<=0||already+amount>pool+0.0001){notify("Enter a positive amount no greater than the remaining milestone pool of "+money(Math.max(0,pool-already))+".");return;}
      app.data.bonusAllocations=app.data.bonusAllocations.filter(function(a){return a.submissionId!==s.id;});
      app.data.bonusAllocations.push({id:"ba-"+Date.now(),submissionId:s.id,campaignId:c.id,clipperId:s.clipperId,amount:amount,allocatedAt:today()});
      addAudit(money(amount)+" of the “"+c.name+"” bonus pool allocated to "+s.clipperName+".");save();app.modal="";render();notify("Campaign bonus allocation recorded in the local ledger.");
    }
    function handleProfileSubmit(form,event){
      event.preventDefault();var v=formValues(form),u=currentUser();u.name=v.name.trim();u.handle=v.handle.trim();u.email=v.email.trim();addAudit("Clipper profile updated for "+u.name+".");save();app.modal="";render();notify("Profile saved in this browser.");
    }
    function chooseRole(role,requestedId){
      app.role=role;app.filter="all";app.search="";
      var chosen=requestedId&&app.data.users.find(function(u){return u.id===requestedId;});
      if(!chosen)chosen=app.data.users.find(function(u){return role==="admin"?u.role==="admin":role==="clipper"?u.role==="clipper"&&u.status!=="suspended":["business","creator"].indexOf(u.role)>=0;});
      if(chosen)app.userId=chosen.id;
      app.view=role==="clipper"?"overview":"overview";render();
    }
    function joinCampaign(id){
      var c=campaign(id);if(!c||c.status!=="live"){notify("Only live campaigns can be joined.");return;}
      if(!app.data.enrollments.some(function(e){return e.campaignId===id&&e.clipperId===app.userId;})){app.data.enrollments.unshift({campaignId:id,clipperId:app.userId,joinedAt:today()});addAudit(currentUser().name+" joined campaign “"+c.name+"”.");save();}
      app.view="discover";render();notify("Campaign joined. Submit your published clip when ready.");
    }
    function exportCSV(kind){
      var rows=kind==="insights"?app.data.campaigns.map(function(c){return [c.name,c.owner,c.status,unitLabel(c.rateUnit),c.rate,campaignViews(c),app.data.submissions.filter(function(s){return s.campaignId===c.id;}).reduce(function(t,s){return t+(Number(s.claimedViews)||0);},0)];}):payoutRows().map(function(r){return [r.submission.clipperName,r.submission.handle,r.campaign?r.campaign.name:"",r.base,r.bonus,r.total,r.fullyPaid?"Recorded paid":r.paid>0?"Partially paid":"Unpaid",r.lastReference];});
      var header=kind==="insights"?["Campaign","Owner","Status","Rate unit","Rate INR","Verified views","Self-reported views"]:["Clipper","Handle","Campaign","Base INR","Bonus INR","Total INR","Status","Payment reference"];
      var lines=[header].concat(rows).map(function(row){return row.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
      var blob=new Blob(["\ufeff"+lines],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="clipsetu-"+kind+"-"+today()+".csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);notify("CSV generated from this browser's demo records.");
    }
    document.addEventListener("click",function(e){
      var el=e.target.closest("[data-action]");if(!el)return;var a=el.dataset.action,id=el.dataset.id;
      if(a==="navigate"){app.view=el.dataset.view;app.search="";app.filter="all";render();}
      else if(a==="new-campaign")openModal("campaign","");
      else if(a==="edit-campaign")openModal("campaign",id);
      else if(a==="new-asset")openModal("asset","");
      else if(a==="new-user")openModal("register","");
      else if(a==="new-submission")openModal("submission",el.dataset.campaign||"");
      else if(a==="edit-payout-method"){if(app.role!=="clipper"){notify("Switch to a clipper demo account to submit a method.");return;}openModal("payout-method","");}
      else if(a==="approve-payout-method")handlePayoutMethodDecision(id,"approved");
      else if(a==="reject-payout-method")handlePayoutMethodDecision(id,"rejected");
      else if(a==="view-payout-proof"){var proof=app.data.payouts.find(function(p){return p.id===id;});if(!proof||(app.role!=="admin"&&!(app.role==="clipper"&&proof.clipperId===app.userId))){notify("This payment proof is not available for this demo role.");return;}app.editingId=id;app.modal="receipt";render();}
      else if(a==="review")openModal("review",id);
      else if(a==="toggle-risk"){var riskClip=app.data.submissions.find(function(s){return s.id===id;});if(riskClip){riskClip.risk=!riskClip.risk;addAudit((riskClip.risk?"Fraud / quality review flag added":"Review flag cleared")+" for submission "+riskClip.id+".");save();render();notify(riskClip.risk?"Submission held for additional review.":"Review hold cleared.");}}
      else if(a==="mark-paid"){if(app.role!=="admin"){notify("Only an admin can record a manual payment.");return;}var r=payoutRows().find(function(x){return x.submission.id===id;});if(!r)return;if(r.submission.risk){notify("Clear the review flag before recording a payout.");return;}if(r.locked){notify("Resolve campaign payout terms first.");return;}if(r.needsAllocation){notify("Allocate the campaign bonus pool first.");return;}var method=payoutMethodFor(r.submission.clipperId);if(!method||method.status!=="approved"){notify("Approve the clipper's payout method first.");return;}app.editingId=id;app.modal="payout";render();var amt=document.querySelector('[name="paidAmount"]');if(amt)amt.value=(r.remaining||0).toFixed(2);}
      else if(a==="allocate-bonus"){var row=payoutRows().find(function(x){return x.submission.id===id;});if(!row||!row.campaign)return;app.editingId=id;app.modal="allocation";render();}
      else if(a==="edit-profile")openModal("profile","");
      else if(a==="open-profile"){if(app.role==="clipper")openModal("profile","");else openModal("register","");}
      else if(a==="campaign-details")openModal("details",id);
      else if(a==="join-campaign")joinCampaign(id);
      else if(a==="filter-submissions"){app.filter=el.dataset.filter;render();}
      else if(a==="submission-details"){var s=app.data.submissions.find(function(x){return x.id===id;});if(s){notify("Status: "+s.status+". "+(s.reviewNote||"No review note yet."));}}
      else if(a==="publish-campaign"){openModal("campaign",id);}
      else if(a==="use-asset"){var x=asset(id);app.modal="campaign";app.editingId="";render();var src=document.querySelector('[name="sourceUrl"]');if(src)src.value=x.url||"";notify("Source link placed in a new campaign form.");}
      else if(a==="delete-asset"){if(!confirm("Remove this content reference from the demo library?"))return;app.data.assets=app.data.assets.filter(function(x){return x.id!==id;});addAudit("A content reference was removed.");save();render();notify("Content reference removed.");}
      else if(a==="approve-user"){var u=user(id);if(u){u.status="active";addAudit("Clipper profile "+u.name+" approved.");save();render();notify("Clipper profile approved in demo mode.");}}
      else if(a==="suspend-user"){var usr=user(id);if(usr){usr.status=usr.status==="suspended"?"active":"suspended";addAudit("Clipper profile "+usr.name+" set to "+usr.status+".");save();render();notify("Profile status updated.");}}
      else if(a==="set-review-status"){var h=document.getElementById("reviewStatus");if(h)h.value=el.dataset.status;var f=document.getElementById("reviewForm");if(f)f.requestSubmit();}
      else if(a==="export-payouts")exportCSV("payouts");
      else if(a==="export-insights")exportCSV("insights");
      else if(a==="reset-demo"){if(app.role!=="admin"){notify("Only the admin demo role can reset sample data.");return;}if(!confirm("Reset this website's local demo records to their original sample data?"))return;localStorage.removeItem(STORAGE_KEY);app.data=seedState();app.role="admin";app.userId="u-admin";app.view="overview";app.modal="";app.search="";app.filter="all";render();notify("Demo data reset in this browser.");}
      else if(a==="close-modal")closeModal();
      else if(a==="backdrop-close"&&e.target===el)closeModal();
    });
    document.addEventListener("submit",function(e){
      if(e.target.id==="campaignForm")handleCampaignSubmit(e.target,e);
      else if(e.target.id==="assetForm")handleAssetSubmit(e.target,e);
      else if(e.target.id==="registerForm")handleRegister(e.target,e);
      else if(e.target.id==="submissionForm")handleSubmissionSubmit(e.target,e);
      else if(e.target.id==="reviewForm")handleReviewSubmit(e.target,e);
      else if(e.target.id==="payoutMethodForm")handlePayoutMethodSubmit(e.target,e);
      else if(e.target.id==="payoutForm")handlePayoutSubmit(e.target,e);
      else if(e.target.id==="allocationForm")handleBonusAllocationSubmit(e.target,e);
      else if(e.target.id==="profileForm")handleProfileSubmit(e.target,e);
    });
    document.addEventListener("change",function(e){
      if(e.target.id==="roleSelect"){var parts=e.target.value.split(":");chooseRole(parts[0],parts[1]);}
      if(e.target.id==="campaignStatusFilter"){var cards=Array.from(document.querySelectorAll(".campaign-card"));cards.forEach(function(card){var badge=card.querySelector(".badge");if(e.target.value==="all"||!badge||badge.textContent.toLowerCase().indexOf(e.target.value)>=0)card.style.display="";else card.style.display="none";});}
    });
    document.addEventListener("input",function(e){
      if(["campaignSearch","assetSearch","submissionSearch","userSearch"].indexOf(e.target.id)>=0){app.search=e.target.value;var start=e.target.selectionStart,end=e.target.selectionEnd,scroll=e.target.scrollTop;render();var next=document.getElementById(e.target.id);if(next){next.focus();next.setSelectionRange(start,end);next.scrollTop=scroll;}}
    });
    document.addEventListener("keydown",function(e){if(e.key==="Escape"&&app.modal)closeModal();});
    render();
  })();
  </script>
</body>
</html>
